<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CleanYourVizio</title>
<!--
  Cast receiver for the CleanYourVizio home screen. It holds no data of its own: the sender on the
  home network pushes tiles, focus, weather, scores, recently watched, sun times and the art over the
  urn:x-cast:com.cleanyourvizio.home channel. Motion is transform/opacity only (low-end TV chip).
-->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --glow: 90, 70, 200; --sky: 0, 0, 0; --sky-a: 0; --night: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: Outfit, system-ui, sans-serif; cursor: none; }

  /* Art: two slides crossfade; the active one drifts slowly (Ken Burns). */
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 2.5s ease; overflow: hidden; }
  .slide.on { opacity: 1; }
  .slide .img { position: absolute; inset: -4%; background: #000 center / cover no-repeat; will-change: transform; }
  .slide .img.fit { background-size: contain; inset: 4% 4% 26% 38%; }
  .slide.on .img { animation: drift var(--dur, 240s) linear forwards; }
  @keyframes drift { from { transform: scale(1.02) translate(0, 0); }
                     to { transform: scale(1.12) translate(var(--dx, -2%), var(--dy, -1%)); } }

  /* Weather over the art: rain, snow, storm flashes, drifting cloud or fog. Transform/opacity only. */
  #fx { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .drop { position: absolute; top: -12vh; width: .12vw; height: 9vh; border-radius: .1vw;
    background: linear-gradient(rgba(220,230,255,0), rgba(220,230,255,.45));
    animation: fall linear infinite; will-change: transform; }
  @keyframes fall { to { transform: translate(-6vw, 125vh) rotate(8deg); } }
  .flake { position: absolute; top: -3vh; border-radius: 50%; background: rgba(255,255,255,.85);
    animation: snow linear infinite; will-change: transform; }
  @keyframes snow { 33% { transform: translate(1.5vw, 35vh); } 66% { transform: translate(-1vw, 70vh); }
                    to { transform: translate(1vw, 108vh); } }
  .cloud { position: absolute; width: 70vw; height: 45vh; border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(235,238,245,var(--a,.16)), rgba(235,238,245,0) 65%);
    animation: drift-x linear infinite; will-change: transform; }
  @keyframes drift-x { from { transform: translateX(-75vw); } to { transform: translateX(110vw); } }
  .flash { position: absolute; inset: 0; background: #dfe6ff; opacity: 0; animation: flash 11s infinite; }
  @keyframes flash { 0%, 91%, 93.5%, 95%, 100% { opacity: 0; } 92% { opacity: .22; } 94.2% { opacity: .14; } }

  #sky { position: absolute; inset: 0; background: rgba(var(--sky), var(--sky-a)); }
  /* Slow sky and night fades only after the first state has landed, so a fresh launch is not dark for a minute. */
  body.settled #sky { transition: background 60s linear; }
  #scrim { position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.18) 30%, rgba(0,0,0,0) 48%),
                linear-gradient(0deg, rgba(0,0,0,.7) 0%, rgba(0,0,0,.2) 26%, rgba(0,0,0,0) 40%),
                linear-gradient(180deg, rgba(0,0,0,.3) 0%, rgba(0,0,0,0) 20%),
                radial-gradient(ellipse 30% 30% at 92% 12%, rgba(0,0,0,.5), rgba(0,0,0,0) 100%);
    transition: opacity 2s ease; }
  #glow { position: absolute; inset: -20%; pointer-events: none; opacity: .55; transition: opacity 1.2s ease;
    background: radial-gradient(ellipse 40% 30% at 30% 92%, rgba(var(--glow), .7), transparent 70%);
    }

  #ui { position: absolute; inset: 0; }
  #top { position: absolute; left: 6.5vw; top: 7.5vh; text-shadow: 0 .2vw 1.5vw rgba(0,0,0,.5); }
  #greeting { font-weight: 300; font-size: 2.5vw; color: #d6d6db; }
  #clock { font-weight: 100; font-size: 11vw; line-height: 1; margin-left: -.35vw; letter-spacing: -.2vw; }
  #date { font-weight: 300; font-size: 2.2vw; color: #e4e4e8; margin-top: .4vh; }
  #recent { font-weight: 300; font-size: 1.35vw; color: #b9b9c0; margin-top: 1.6vh; min-height: 1.8vw; }
  #recent b { font-weight: 400; color: #ececf0; }

  #right { position: absolute; right: 6.5vw; top: 7.5vh; width: 24vw; display: flex; flex-direction: column;
    align-items: flex-end; gap: 1.6vh; }
  #weather { text-align: right; text-shadow: 0 .1vw .4vw rgba(0,0,0,.6), 0 .2vw 1.5vw rgba(0,0,0,.5); }
  #temp { font-weight: 200; font-size: 5.2vw; line-height: 1; }
  #sky-text { font-weight: 400; font-size: 1.6vw; color: #e8e8ec; margin-top: .6vh; }
  #hilo { font-weight: 300; font-size: 1.25vw; color: #b4b4bc; margin-top: .2vh; }
  .card { width: 100%; background: linear-gradient(135deg, rgba(28,28,36,.82), rgba(14,14,20,.72));
    border: 1px solid rgba(255,255,255,.09); border-radius: 1.2vw; padding: 1.2vw 1.4vw;
    opacity: 0; transform: translateY(1vh); animation: rise .6s ease forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  #scores { width: 100%; display: flex; flex-direction: column; gap: 1.6vh; }
  .score .row { display: flex; align-items: center; gap: .9vw; font-size: 1.7vw; font-weight: 300; }
  .score .row + .row { margin-top: .6vh; }
  .score img { width: 2.2vw; height: 2.2vw; object-fit: contain; }
  .score .abbr { flex: 1; }
  .score .ours .abbr, .score .ours .pts { font-weight: 500; }
  .score .pts { font-variant-numeric: tabular-nums; }
  .score .meta { display: flex; justify-content: space-between; gap: 1vw; margin-top: .8vh; font-size: 1.05vw; color: #a8a8b0; }
  .cal .head { font-size: 1.05vw; color: #a8a8b0; letter-spacing: .08vw; margin-bottom: .6vh; }
  #cal { width: 100%; }
  .cal .ev { display: grid; grid-template-columns: 8.4vw 1fr; gap: 1vw; align-items: baseline; font-size: 1.45vw; font-weight: 300; }
  .cal .ev + .ev { margin-top: .5vh; }
  .cal .when { font-size: 1.1vw; color: #c9c9d0; }
  .cal .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live { color: #ff5a5a; font-weight: 500; letter-spacing: .08vw; }
  .live::before { content: ''; display: inline-block; width: .55vw; height: .55vw; border-radius: 50%;
    background: #ff3b3b; margin-right: .45vw; vertical-align: .1vw; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  #caption { position: absolute; right: 6.5vw; bottom: 29vh; text-align: right; max-width: 40vw;
    text-shadow: 0 .15vw 1vw rgba(0,0,0,.7); transition: opacity 1.5s ease; }
  #caption .t { font-size: 1.35vw; font-weight: 400; font-style: italic; color: #ececf0; }
  #caption .b { font-size: 1.1vw; font-weight: 300; color: #b8b8c0; margin-top: .3vh; }
  #caption .c { font-size: .85vw; font-weight: 300; color: #85858e; margin-top: .3vh; }

  #name { position: absolute; left: 6.5vw; bottom: 28vh; font-weight: 300; font-size: 3vw;
    text-shadow: 0 0 2.2vw rgba(var(--glow), .9), 0 .2vw 1vw rgba(0,0,0,.6); }
  #band { position: absolute; left: 4.6vw; right: 4.6vw; bottom: 6vh; height: 19vh;
    background: rgba(18,18,24,.55); border: 1px solid rgba(255,255,255,.07); border-radius: 2vw; }
  #dock { position: absolute; left: 6.5vw; right: 6.5vw; bottom: 8.5vh; height: 14vh; display: flex; gap: 1.4vw; }
  .tile { flex: 1; border-radius: 1.1vw; overflow: hidden; position: relative;
    background: linear-gradient(160deg, #2c2d38, #15151b) center / cover no-repeat; transition: transform .35s cubic-bezier(.2,.9,.3,1.2);
    display: flex; align-items: center; justify-content: center; font-size: 1.6vw; font-weight: 400;
    box-shadow: 0 .6vw 1.6vw rgba(0,0,0,.45); }
  .tile.focus { transform: scale(1.08); }
  #hl { position: absolute; bottom: 8.5vh; height: 14vh; border-radius: 1.3vw; pointer-events: none;
    background: rgba(255,255,255,.1); box-shadow: 0 0 0 .22vw rgba(255,255,255,.6), 0 1vw 3vw rgba(0,0,0,.6);
    transition: left .45s cubic-bezier(.2,.9,.3,1.15), width .45s, opacity 1.2s ease; transform: scale(1.08); }
  #name, #band, #dock { transition: opacity 1.2s ease, transform 1.2s ease; }
  #caption { transition: opacity 1.5s ease, bottom 1.2s ease; }
  body.ambient #name, body.ambient #band, body.ambient #dock, body.ambient #hl { opacity: 0; }
  body.ambient #dock, body.ambient #band { transform: translateY(4vh); }
  body.ambient #caption { bottom: 7vh; }
  body.ambient #glow { opacity: 0; }
  #night { position: absolute; inset: 0; background: #000; opacity: var(--night); pointer-events: none;
  }
  body.settled #night { transition: opacity 60s linear; }
</style>
</head>
<body>
<div class="slide" id="s0"><div class="img"></div></div>
<div class="slide" id="s1"><div class="img"></div></div>
<div id="fx"></div>
<div id="sky"></div>
<div id="scrim"></div>
<div id="glow"></div>
<div id="ui">
  <div id="top">
    <div id="greeting"></div>
    <div id="clock"></div>
    <div id="date"></div>
    <div id="recent"></div>
  </div>
  <div id="right">
    <div id="weather"><div id="temp"></div><div id="sky-text"></div><div id="hilo"></div></div>
    <div id="scores"></div>
    <div id="cal"></div>
  </div>
  <div id="caption"><div class="t"></div><div class="b"></div><div class="c"></div></div>
  <div id="name"></div>
  <div id="band"></div>
  <div id="dock"></div>
  <div id="hl"></div>
</div>
<div id="night"></div>
<script>
const NS = 'urn:x-cast:com.cleanyourvizio.home';
const $ = id => document.getElementById(id);
const root = document.documentElement.style;
let state = { tiles: [], focus: 0, weather: null, scores: [], recent: [], sun: null };
let front = 0;
let ambientTimer = 0;
const AMBIENT_AFTER = 45e3;

// Any remote input brings the dock back; it hides again after AMBIENT_AFTER of quiet.
function wake() {
  document.body.classList.remove('ambient');
  clearTimeout(ambientTimer);
  ambientTimer = setTimeout(() => document.body.classList.add('ambient'), AMBIENT_AFTER);
}
const photoParts = {};

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function tick() {
  const now = new Date();
  const h = now.getHours();
  $('greeting').textContent = h >= 5 && h < 12 ? 'Good morning' : h >= 5 && h < 17 ? 'Good afternoon' : 'Good evening';
  $('clock').textContent = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/, '');
  $('date').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  drawSky(now);
}

// Sky tint from real sunrise/sunset: warm around both, clear by day, deep blue at night, dim after 11 PM.
function drawSky(now) {
  const s = state.sun;
  let tint = [10, 14, 40], a = .28;
  if (s) {
    const t = now.getTime(), rise = new Date(s.sunrise).getTime(), set = new Date(s.sunset).getTime();
    const hr = 3600e3, near = (x) => Math.abs(t - x) < hr;
    if (near(rise)) { tint = [255, 140, 90]; a = .16; }
    else if (near(set)) { tint = [255, 105, 80]; a = .2; }
    else if (t > rise && t < set) { tint = [0, 0, 0]; a = 0; }
  }
  root.setProperty('--sky', tint.join(','));
  root.setProperty('--sky-a', a);
  const h = now.getHours();
  root.setProperty('--night', h >= 23 || h < 6 ? .45 : 0);
}

function drawTiles() {
  const dock = $('dock');
  dock.textContent = '';
  state.tiles.forEach((t, i) => {
    const d = el('div', 'tile' + (i === state.focus ? ' focus' : ''));
    // Icons are square-ish: show them whole, on their own edge colour so the tile reads as one piece.
    if (t.icon) d.style.background = `${/^#[0-9a-f]{6}$/i.test(t.bg || '') ? t.bg : '#1b1c22'} url("${encodeURI(t.icon)}") center / contain no-repeat`;
    else d.textContent = t.label;
    dock.appendChild(d);
  });
  drawFocus();
}

function drawFocus() {
  const tiles = $('dock').children;
  [...tiles].forEach((e, i) => e.classList.toggle('focus', i === state.focus));
  const e = tiles[state.focus];
  if (!e) return;
  $('hl').style.left = e.offsetLeft + $('dock').offsetLeft + 'px';
  $('hl').style.width = e.offsetWidth + 'px';
  const t = state.tiles[state.focus];
  $('name').textContent = t.label;
  if (Array.isArray(t.glow) && t.glow.length === 3)
    root.setProperty('--glow', t.glow.map(n => Math.max(0, Math.min(255, n | 0))).join(','));
}

function drawWeather() {
  const w = state.weather;
  $('weather').style.visibility = w ? 'visible' : 'hidden';
  if (!w) return;
  $('temp').textContent = `${w.temp}°`;
  $('sky-text').textContent = w.sky;
  $('hilo').textContent = `H ${w.hi}°  L ${w.lo}°  ·  ${w.place}`;
}

function drawScores() {
  const box = $('scores');
  const key = JSON.stringify(state.scores);
  if (box.dataset.key === key) return;
  box.dataset.key = key;
  box.textContent = '';
  (state.scores || []).forEach(g => {
    const card = el('div', 'card score');
    g.sides.forEach(s => {
      const row = el('div', 'row' + (s.ours ? ' ours' : ''));
      if (s.logo) { const img = el('img'); img.src = s.logo; img.alt = ''; row.appendChild(img); }
      row.appendChild(el('span', 'abbr', s.abbr));
      if (s.score != null) row.appendChild(el('span', 'pts', s.score));
      card.appendChild(row);
    });
    const meta = el('div', 'meta');
    meta.appendChild(el('span', g.state === 'in' ? 'live' : '', g.state === 'in' ? 'LIVE' : g.state === 'post' ? 'FINAL' : 'UP NEXT'));
    meta.appendChild(el('span', '', g.state === 'post' ? '' : g.detail));
    card.appendChild(meta);
    box.appendChild(card);
  });
}

function drawCalendar() {
  const box = $('cal');
  const key = JSON.stringify(state.calendar || []);
  if (box.dataset.key === key) return;
  box.dataset.key = key;
  box.textContent = '';
  if (!(state.calendar || []).length) return;
  const card = el('div', 'card cal');
  card.appendChild(el('div', 'head', 'NEXT UP'));
  state.calendar.forEach(e => {
    const row = el('div', 'ev');
    row.appendChild(el('span', 'when', e.when));
    row.appendChild(el('span', 'what', e.title));
    card.appendChild(row);
  });
  box.appendChild(card);
}

// Open-Meteo weather codes -> an effect. Counts stay low for the TV's chip.
function weatherKind(code) {
  if (code == null) return '';
  if (code >= 95) return 'storm';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return code === 65 || code === 82 ? 'heavy' : 'rain';
  if (code === 45 || code === 48) return 'fog';
  if (code === 2 || code === 3) return 'cloud';
  return '';
}

function drawFx() {
  const kind = weatherKind(state.weather && state.weather.code);
  const fx = $('fx');
  if (fx.dataset.kind === kind) return;
  fx.dataset.kind = kind;
  fx.textContent = '';
  const r = (a, b) => a + Math.random() * (b - a);
  const rain = n => { for (let i = 0; i < n; i++) {
    const d = el('div', 'drop');
    d.style.left = r(0, 112) + 'vw';
    d.style.animationDuration = r(.7, 1.1) + 's';
    d.style.animationDelay = -r(0, 1.1) + 's';
    d.style.opacity = r(.4, 1);
    fx.appendChild(d);
  } };
  const clouds = (n, a) => { for (let i = 0; i < n; i++) {
    const c = el('div', 'cloud');
    c.style.top = r(-15, kind === 'fog' ? 70 : 35) + 'vh';
    c.style.setProperty('--a', a);
    const dur = r(140, 220);
    c.style.animationDuration = dur + 's';
    c.style.animationDelay = -r(0, dur) + 's';
    fx.appendChild(c);
  } };
  if (kind === 'rain') rain(40);
  if (kind === 'heavy') rain(70);
  if (kind === 'storm') { rain(60); fx.appendChild(el('div', 'flash')); }
  if (kind === 'snow') for (let i = 0; i < 45; i++) {
    const f = el('div', 'flake'), size = r(.25, .7);
    f.style.width = f.style.height = size + 'vw';
    f.style.left = r(0, 100) + 'vw';
    f.style.opacity = r(.4, .9);
    const dur = r(9, 16);
    f.style.animationDuration = dur + 's';
    f.style.animationDelay = -r(0, dur) + 's';
    fx.appendChild(f);
  }
  if (kind === 'cloud') clouds(3, .14);
  if (kind === 'fog') clouds(5, .22);
}

function drawRecent() {
  const r = state.recent || [];
  const box = $('recent');
  box.textContent = '';
  if (!r.length) return;
  box.appendChild(document.createTextNode('Jump back in  '));
  r.forEach((x, i) => {
    if (i) box.appendChild(document.createTextNode('  ·  '));
    box.appendChild(el('b', '', x.name));
    box.appendChild(document.createTextNode(' ' + x.ago));
  });
}

// Preload, then crossfade to the other slide with a random drift direction.
function showArt(src, meta) {
  const img = new Image();
  img.onload = () => {
    front = 1 - front;
    const slide = $('s' + front), pic = slide.firstElementChild;
    pic.classList.toggle('fit', img.naturalWidth < img.naturalHeight * 1.15);
    pic.style.backgroundImage = `url("${src}")`;
    pic.style.setProperty('--dx', (Math.random() * 6 - 3).toFixed(2) + '%');
    pic.style.setProperty('--dy', (Math.random() * 4 - 2).toFixed(2) + '%');
    pic.style.animation = 'none'; void pic.offsetWidth; pic.style.animation = '';
    slide.classList.add('on');
    $('s' + (1 - front)).classList.remove('on');
    const cap = $('caption');
    cap.style.opacity = 0;
    setTimeout(() => {
      cap.querySelector('.t').textContent = meta.title || '';
      cap.querySelector('.b').textContent = [meta.by, meta.date].filter(Boolean).join(', ');
      cap.querySelector('.c').textContent = meta.credit || '';
      cap.style.opacity = meta.title ? 1 : 0;
    }, 1500);
  };
  img.src = src;
}

function onMessage(event) {
  const msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
  if (msg.type === 'state') {
    const tilesChanged = JSON.stringify(msg.tiles) !== JSON.stringify(state.tiles);
    state = { ...state, ...msg };
    if (tilesChanged) drawTiles(); else drawFocus();
    drawWeather(); drawScores(); drawCalendar(); drawFx(); drawRecent(); tick();
    setTimeout(() => document.body.classList.add('settled'), 100);
  } else if (msg.type === 'focus') {
    state.focus = msg.focus;
    drawFocus();
    wake();
  } else if (msg.type === 'wake') {
    wake();
  } else if (msg.type === 'art' && /^https:\/\//.test(msg.src)) {
    showArt(msg.src, msg);
  } else if (msg.type === 'photo') {
    // A local photo arrives in base64 pieces (Cast messages max out at 64 KB).
    const p = photoParts[msg.id] = photoParts[msg.id] || [];
    p[msg.i] = msg.data;
    if (p.filter(Boolean).length === msg.n) {
      showArt('data:image/jpeg;base64,' + p.join(''), {});
      delete photoParts[msg.id];
    }
  }
}

tick();
setInterval(tick, 1000);
drawWeather();
wake();

const ctx = cast.framework.CastReceiverContext.getInstance();
ctx.addCustomMessageListener(NS, onMessage);
const opts = new cast.framework.CastReceiverOptions();
opts.disableIdleTimeout = true;
opts.skipPlayersLoad = true;
opts.customNamespaces = { [NS]: cast.framework.system.MessageType.JSON };
ctx.start(opts);
</script>
</body>
</html>
